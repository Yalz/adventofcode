name: Maven Build and Use JARs

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Build with Maven
        run: mvn clean package

      - name: Upload JARs
        uses: actions/upload-artifact@v2
        with:
          name: my-jars
          path: '**/*.jar'

  use-jars:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download JARs
        uses: actions/download-artifact@v2
        with:
          name: my-jars
          path: jars

      - name: Use JARs
        run: |
          ls jars
          # Add your commands to use the JARs here
