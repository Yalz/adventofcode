name: Maven Build and Use JARs

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 18
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Build with Maven
        run: mvn clean package

      - name: Upload JARs
        uses: actions/upload-artifact@v2
        with:
          name: my-jars
          path: '**/*.jar'

  use-jars:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4
      - name: Download JARs
        uses: actions/download-artifact@v2
        with:
          name: my-jars
          path: artifacts

      - name: Rename JARs
        run: |
          for file in artifacts/*; do
            if [ -f "$file" ]; then
              echo "processing file"
              mv "$file" "../.github/$(basename "$file").jar"
            fi
          done
          rm ./artifacts -r

      - name: Use JARs
        run: |
          find ./
          # Add your commands to use the JARs here
